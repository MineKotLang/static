<!DOCTYPE html>
<html>
<head>
    <title>MinekotLang Static API</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            overflow-y: auto;
        }
        h1 { 
            color: #cba6f7;
            font-weight: 600;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        h2 { 
            color: #cba6f7;
            font-weight: 600;
            font-size: 2em;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        .section { 
            margin: 30px 0;
            padding: 20px;
            background: #313244;
            border-left: 3px solid #cba6f7;
            border-radius: 4px;
        }
        .section h2 { 
            color: #b4befe;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        a { 
            color: #cba6f7;
            text-decoration: none;
            font-size: 1.1em;
            transition: color 0.2s;
        }
        a:hover { 
            color: #b4befe;
            text-decoration: underline;
        }
        .loading { 
            color: #a6adc8;
            font-style: italic;
        }
        .error { 
            color: #f38ba8;
        }
        #content {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>> minekotlang/static</h1>
    <h2>/<span id="current-dir"></span></h2>
    <div id="content" class="loading">// Loading directory contents...</div>

    <script>
        const owner = 'MineKotLang';
        const repo = 'static';
        
        // Determine base path to handle subfolder hosting on GitHub Pages
        let basePath = '/';
        const pathParts = window.location.pathname.split('/');
        if (pathParts[1] === repo) {
            basePath = '/' + repo + '/';
        }

        // Helper to extract the relative path from the URL
        function getPathFromUrl(urlPath) {
            let p = urlPath.substring(basePath.length);
            if (p.startsWith('/')) p = p.substring(1);
            if (p.endsWith('/')) p = p.substring(0, p.length - 1);
            if (p.toLowerCase() === 'index.html' || p.toLowerCase() === '404.html') {
                p = '';
            }
            return p;
        }

        // Core loading function
        function loadDirectory(path, pushState = true) {
            document.getElementById('current-dir').textContent = path;
            const content = document.getElementById('content');

            if (path === 'api/contents' || path === 'api/contents.json') {
                content.innerHTML = '<div class="loading">// Querying GitHub API recursively for documentation contents...</div>';

                function parseFrontmatter(text) {
                    const metadata = {};
                    let body = text;
                    if (text.startsWith("---")) {
                        const end = text.indexOf("---", 3);
                        if (end !== -1) {
                            const fm = text.substring(3, end);
                            body = text.substring(end + 3).trim();
                            fm.split("\n").forEach(line => {
                                const col = line.indexOf(":");
                                if (col !== -1) {
                                    const k = line.substring(0, col).trim();
                                    let v = line.substring(col + 1).trim();
                                    if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
                                        v = v.substring(1, v.length - 1);
                                    }
                                    if (k) metadata[k] = v;
                                }
                            });
                        }
                    }
                    return { body, metadata };
                }

                async function scanDir(dirPath, section) {
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${dirPath}`);
                    if (!res.ok) throw new Error(`GitHub API returned ${res.status} for ${dirPath}`);
                    const items = await res.json();
                    const pages = [];
                    for (const item of items) {
                        if (item.name.startsWith('.') || item.name.endsWith('.json')) continue;
                        if (item.type === 'dir') {
                            const sub = await scanDir(item.path, section);
                            pages.push(...sub);
                        } else if (item.type === 'file' && item.name.endsWith('.md')) {
                            const fRes = await fetch(item.download_url);
                            let fm = {};
                            if (fRes.ok) {
                                const text = await fRes.text();
                                fm = parseFrontmatter(text).metadata;
                            }

                            let relPath = item.path;
                            if (relPath.startsWith("documentation/")) {
                                relPath = relPath.substring("documentation/".length);
                            }

                            const segments = relPath.split("/");
                            const innerPath = relPath.substring(section.length + 1);
                            let pagePath = "";
                            if (item.name.toLowerCase() === "index.md") {
                                const dir = segments.slice(1, -1).join("/");
                                pagePath = dir ? `/${dir}/` : "/";
                            } else {
                                pagePath = innerPath;
                            }

                            const pageInfo = {
                                path: pagePath,
                                section: section,
                                ...fm
                            };

                            if (fm.weight !== undefined) pageInfo.weight = parseInt(fm.weight, 10);
                            else if (fm.sidebar_position !== undefined) pageInfo.weight = parseInt(fm.sidebar_position, 10);

                            pages.push(pageInfo);
                        }
                    }
                    return pages;
                }

                Promise.all([
                    scanDir("documentation/docs", "docs"),
                    scanDir("documentation/modules", "modules"),
                    scanDir("documentation/scripts", "scripts")
                ]).then(([docs, modules, scripts]) => {
                    const all = [...docs, ...modules, ...scripts];
                    if (window.self !== window.top) {
                        window.parent.postMessage({ type: 'MINEKOT_CONTENTS', data: all }, '*');
                        content.innerHTML = '<div class="success">// Sent contents to parent window.</div>';
                    } else {
                        document.body.style.whiteSpace = 'pre';
                        document.body.style.fontFamily = 'monospace';
                        document.body.innerHTML = JSON.stringify(all, null, 2);
                    }
                }).catch(err => {
                    content.innerHTML = `<div class="error">// API Error: ${err.message}</div>`;
                    if (window.self !== window.top) {
                        window.parent.postMessage({ type: 'MINEKOT_ERROR', error: err.message }, '*');
                    }
                });
                return;
            }

            content.innerHTML = '<div class="loading">// Loading directory contents...</div>';

            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            fetch(apiUrl)
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`GitHub API returned ${res.status} ${res.statusText}`);
                    }
                    return res.json();
                })
                .then(data => {
                    const items = Array.isArray(data) ? data : [data];
                    
                    const dirs = items
                        .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
                        .sort((a, b) => a.name.localeCompare(b.name));
                        
                    const files = items
                        .filter(item => item.type === 'file' && !item.name.startsWith('.') && item.name !== 'index.html' && item.name !== '404.html')
                        .sort((a, b) => a.name.localeCompare(b.name));

                    content.innerHTML = '';

                    // Add ".." navigation if we're not in the root directory
                    if (path !== '') {
                        const parentPathParts = path.split('/');
                        parentPathParts.pop(); // Remove current folder
                        const parentPath = parentPathParts.join('/');
                        const parentUrl = basePath + (parentPath ? parentPath + '/' : '');

                        const section = document.createElement('div');
                        section.className = 'section';
                        section.innerHTML = `
                            <h2>📁 ..</h2>
                            <p><a href="${parentUrl}" class="dir-link" data-path="${parentPath}">→ go back</a></p>
                        `;
                        content.appendChild(section);
                    }

                    if (dirs.length === 0 && files.length === 0) {
                        content.innerHTML += '<p class="error">// Directory is empty.</p>';
                        return;
                    }

                    dirs.forEach(dir => {
                        const section = document.createElement('div');
                        section.className = 'section';
                        const dirPath = (path ? path + '/' : '') + dir.name;
                        const linkUrl = basePath + dirPath + '/';
                        section.innerHTML = `
                            <h2>📁 ${dir.name}</h2>
                            <p><a href="${linkUrl}" class="dir-link" data-path="${dirPath}">→ view</a></p>
                        `;
                        content.appendChild(section);
                    });

                    files.forEach(file => {
                        const section = document.createElement('div');
                        section.className = 'section';
                        const linkUrl = basePath + (path ? path + '/' : '') + file.name;
                        section.innerHTML = `
                            <h2>📄 ${file.name}</h2>
                            <p><a href="${linkUrl}">→ open</a></p>
                        `;
                        content.appendChild(section);
                    });

                    if (pushState) {
                        const newUrl = basePath + (path ? path + '/' : '');
                        window.history.pushState({ path: path }, '', newUrl);
                    }
                })
                .catch(err => {
                    content.innerHTML = `<p class="error">// Error loading directory: ${err.message}</p>`;
                });
        }

        // Intercept clicks on directory links
        document.addEventListener('click', e => {
            const link = e.target.closest('.dir-link');
            if (link) {
                e.preventDefault();
                const path = link.getAttribute('data-path');
                loadDirectory(path);
            }
        });

        // Handle browser back/forward buttons
        window.addEventListener('popstate', e => {
            if (e.state && typeof e.state.path === 'string') {
                loadDirectory(e.state.path, false);
            } else {
                loadDirectory(getPathFromUrl(window.location.pathname), false);
            }
        });

        // Initial load
        const initialPath = getPathFromUrl(window.location.pathname);
        window.history.replaceState({ path: initialPath }, '', window.location.pathname);
        loadDirectory(initialPath, false);
    </script>
</body>
</html>
